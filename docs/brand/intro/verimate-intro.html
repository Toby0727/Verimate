@media (prefers-reduced-motion: no-preference) {
  .hype-wiggle {
    transform-origin: 50% 60%;
    animation: 3.2s ease-in-out infinite hype-wiggle;
  }

  .hype-wiggle-soft {
    animation: 4s ease-in-out infinite hype-wiggle-soft;
  }

  .hype-pop {
    animation: .6s cubic-bezier(.2, 1.4, .4, 1) both hype-pop;
  }

  .hype-shine:after {
    content: "";
    pointer-events: none;
    background: linear-gradient(105deg, #0000 35%, #ffffff59 50%, #0000 65%);
    animation: 3.2s ease-in-out infinite hype-shine;
    position: absolute;
    inset: 0;
    transform: translateX(-120%);
  }

  .hype-confetti {
    animation: hype-confetti var(--fall, 1.8s) cubic-bezier(.2, .6, .4, 1) var(--delay, 0s) both;
  }

  .hype-pulse {
    animation: 2s ease-in-out infinite hype-pulse;
  }
}

@keyframes hype-wiggle {
  0%, 22%, 100% {
    transform: rotate(0);
  }

  4% {
    transform: rotate(-12deg) scale(1.08);
  }

  8% {
    transform: rotate(10deg) scale(1.08);
  }

  12% {
    transform: rotate(-8deg);
  }

  16% {
    transform: rotate(5deg);
  }

  19% {
    transform: rotate(-2deg);
  }
}

@keyframes hype-wiggle-soft {
  0%, 18%, 100% {
    transform: rotate(0);
  }

  4% {
    transform: rotate(-2.2deg) scale(1.015);
  }

  8% {
    transform: rotate(2deg) scale(1.015);
  }

  12% {
    transform: rotate(-1.2deg);
  }

  15% {
    transform: rotate(.6deg);
  }
}

@keyframes hype-pop {
  from {
    opacity: 0;
    transform: scale(.85) translateY(8px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes hype-shine {
  0%, 55% {
    transform: translateX(-120%);
  }

  85%, 100% {
    transform: translateX(120%);
  }
}

@keyframes hype-confetti {
  0% {
    opacity: 1;
    transform: translate3d(0, 0, 0) rotate(0);
  }

  100% {
    opacity: 0;
    transform: translate3d(var(--drift, 0px), 260px, 0) rotate(var(--spin, 540deg));
  }
}

  }
}

<script>
(function () {
  var d = document.documentElement, timers = [];
  function clear() { timers.forEach(clearTimeout); timers = []; }
  function fly() {
    try {
      var m = document.querySelector("[data-logo-mark]"), w = document.querySelector(".intro-fly");
      var s = m && m.ownerSVGElement, f = w && w.querySelector("svg");
      var a = s.getBoundingClientRect(), b = f.getBoundingClientRect();
      d.style.setProperty("--fly-x", a.left - b.left + "px");
      d.style.setProperty("--fly-y", a.top - b.top + "px");
      d.style.setProperty("--fly-s", String(a.height / b.height));
      d.removeAttribute("data-intro-nofly");
    } catch (e) { d.setAttribute("data-intro-nofly", ""); }
  }
  function play() {
    clear();
    var old = document.querySelector(".intro");
    old.replaceWith(old.cloneNode(true));
    ["data-intro-out", "data-intro-run", "data-intro-nofly"].forEach(function (n) { d.removeAttribute(n); });
    d.setAttribute("data-intro", "play");
    var go = function () {
      if (d.hasAttribute("data-intro-run")) return;
      fly();
      d.setAttribute("data-intro-run", "");
      timers.push(setTimeout(fly, 7800));
      timers.push(setTimeout(function () { d.setAttribute("data-intro-out", ""); }, 8130));
      timers.push(setTimeout(function () { d.setAttribute("data-intro", "done"); }, 8530));
    };
    document.fonts.ready.then(go, go);
    timers.push(setTimeout(go, 900));
  }
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (t.closest(".intro-skip-button") && d.getAttribute("data-intro") === "play") {
      clear();
      d.setAttribute("data-intro-out", "");
      d.setAttribute("data-intro", "skip");
      timers.push(setTimeout(function () { d.setAttribute("data-intro", "done"); }, 300));
    }
    if (t.id === "replay") play();
  });
  play();
})();
</script>
