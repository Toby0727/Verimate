<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Verimate Hold live demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%23D81E28%22/%3E%3Cg transform=%22translate(5 5) scale(.58)%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222.6%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z%22/%3E%3Cpath d=%22m8.5 14 2.5 2.5 4.5-5%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/hold.css">
<style>
/* hold.html: presenter live demo. Shared tokens and components come from assets/hold.css. */
:root {
  view-transition-name: none;           /* only the travelling amounts take part in view transitions */
  --pad-x: 28px; --gap: 28px; --bar-py: 14px;
  --bar-amt: 36px; --bar-label: 14px; --bar-note: 13.5px;
  --head-title: 26px; --led-size: 15px; --hold-amt: 28px; --hold-text: 15px;
  --stage-pt: 20px; --stage-pb: 18px; --ctl-h: 58px;
  --mv-h: 28px; --mv-size: 14px;
}
::view-transition { pointer-events: none; }
::view-transition-group(mv-0), ::view-transition-group(mv-1) {
  animation-duration: var(--dur-move); animation-timing-function: var(--ease-move);
}
::view-transition-old(mv-0), ::view-transition-new(mv-0), ::view-transition-old(mv-1), ::view-transition-new(mv-1) {
  animation-duration: var(--dur-move); animation-timing-function: var(--ease-move);
}
/* hold.css gives .chip, .ticks etc. an explicit display, which beats the browser's [hidden] rule. */
[hidden] { display: none !important; }
body { background: var(--wash); }
button { cursor: pointer; }
.nw { white-space: nowrap; }
.amt-swap { animation: amt-swap .28s linear; }
@keyframes amt-swap { from { opacity: .12; } to { opacity: 1; } }

/* ------------------------------------------------------------------ money bar */
.bar {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--gap);
  padding: var(--bar-py) var(--pad-x); background: var(--paper); border-bottom: 1px solid var(--line);
  position: relative; z-index: 20;
}
.cell { position: relative; min-width: 0; display: grid; gap: 3px; isolation: isolate; align-content: start; }
.cell::after {
  content: ""; position: absolute; z-index: -1; top: calc(-1 * var(--bar-py)); bottom: calc(-1 * var(--bar-py));
  left: calc(var(--gap) / -2); right: calc(var(--gap) / -2); background: transparent; transition: background-color .3s linear;
}
.cell:first-child::after { left: calc(-1 * var(--pad-x)); }
.cell:last-child::after { right: calc(-1 * var(--pad-x)); }
.cell + .cell::before {
  content: ""; position: absolute; left: calc(var(--gap) / -2); top: calc(-1 * var(--bar-py)); bottom: calc(-1 * var(--bar-py));
  width: 1px; background: var(--line);
}
.cell.has-money::after { background: var(--brand-tint); }
.cell.is-frozen::after { background: var(--flagged-tint); }
.cell-label { display: flex; align-items: center; gap: 8px; min-width: 0; height: 26px; font-size: var(--bar-label); color: var(--muted); white-space: nowrap; }
.cell-label strong { color: var(--ink); font-weight: 600; }
.cell-label .avatar { width: 24px; height: 24px; }
.cell-label .chip { margin-left: auto; }
.hold-label { color: var(--brand-deep); font-weight: 600; }
.hold-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); flex: none; margin: 0 2px 0 4px; }
.vm-mark { width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; flex: none; }
.vm-mark svg { width: 13px; height: 13px; }
.cell-row { position: relative; display: flex; align-items: center; min-height: calc(var(--bar-amt) * 1.18); }
.cell-amt {
  font-family: var(--font-display); font-weight: 600; font-size: var(--bar-amt); letter-spacing: -.025em; line-height: 1.1;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.cell-note { font-size: var(--bar-note); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.4em; }
/* On the tinted Held cell the grey note would fall under AA contrast, so it darkens there. */
.cell.has-money .cell-note, .cell.is-frozen .cell-note { color: var(--ink-2); }
.lane { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

/* The travelling amount (the one signature motion) */
.mv {
  display: inline-flex; align-items: center; gap: 7px; height: var(--mv-h); padding: 0 11px; border-radius: 999px;
  background: var(--ink); color: #fff; font-size: var(--mv-size); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
  box-shadow: 0 6px 14px -8px rgba(17, 17, 17, .55);
}
.mv-held::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 2px #fff; }
.mv-rel, .mv-ret { background: var(--verified-ink); }

/* ------------------------------------------------------------------ stage */
.stage {
  position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "pj head pl led" "pj hold pl led";
  column-gap: var(--gap); padding: var(--stage-pt) var(--pad-x) var(--stage-pb); min-height: 0;
}
.pwrap { margin: 0; justify-self: center; align-self: start; min-width: 0; }
.pj { grid-area: pj; } .pl { grid-area: pl; }
.pwrap .phone { transition: opacity .25s linear; }
.pwrap.is-idle .phone { opacity: .5; }
.phone { --phone-h: 680px; }
.phone-label .avatar { width: 28px; height: 28px; }

.head { grid-area: head; display: grid; justify-items: start; gap: 12px; padding-bottom: 16px; min-width: 0; }
.date-chip { margin: 0; }
.head-title { font-size: var(--head-title); font-weight: 600; letter-spacing: -.025em; line-height: 1.12; margin: 0; text-wrap: balance; }
.head-title:focus { outline: none; }

.hold { grid-area: hold; display: grid; align-content: start; gap: 10px; min-height: 0; overflow-y: auto; scrollbar-width: none; padding-bottom: 6px; }
.hold::-webkit-scrollbar { display: none; }
.held-item { display: grid; gap: 4px; padding: 13px 15px 14px; }
.hi-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hi-label { font-size: 15px; font-weight: 600; }
.hi-amt { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: var(--hold-amt); letter-spacing: -.025em; line-height: 1.1; }
.hi-text { margin: 0; font-size: var(--hold-text); color: var(--ink-2); line-height: 1.42; text-wrap: pretty; }
.hold .slot-empty { font-size: var(--hold-text); color: var(--muted); }
.hold-note { margin: 2px 2px 0; font-size: var(--hold-text); color: var(--ink-2); line-height: 1.45; text-wrap: pretty; }
/* If the window is short (browser not fullscreen), the column scrolls: the decision button stays pinned, other content fades at the cut. */
.hold .decide { position: sticky; bottom: 0; box-shadow: 0 -10px 0 0 var(--wash); }
.hold.is-over .decide::before {
  content: ""; position: absolute; left: -1px; right: -1px; bottom: calc(100% + 10px); height: 26px; pointer-events: none;
  background: linear-gradient(to bottom, rgba(247, 247, 247, 0), var(--wash));
}
.hold.is-over:not(:has(.decide)) { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 40px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 40px), transparent); }
.owner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 2px 0; border-top: 1px solid var(--line); margin-top: 4px; }
.owner-ic { width: 32px; height: 32px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line-2); display: grid; place-items: center; flex: none; }
.owner-ic svg { width: 17px; height: 17px; }
.owner p { margin: 0; font-size: var(--hold-text); line-height: 1.42; }
.owner .muted { font-size: 13.5px; }
.decide { display: grid; gap: 10px; padding: 14px 15px 15px; border-radius: var(--r-panel); background: var(--paper); border: 1px solid var(--line); }
.decide-who { margin: 0; font-size: 15px; font-weight: 600; }
.decide-note { margin: 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }

/* Ledger panel: fees on top (scroll if they ever outgrow the panel), costs and "Kept so far" pinned to the bottom. */
.led {
  grid-area: led; align-self: start; max-height: 100%; display: flex; flex-direction: column; overflow: hidden;
  padding: 14px 8px 16px; box-sizing: border-box; min-width: 0;
}
.led-head { flex: none; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 10px 8px; }
.led-head h2 { font-size: 18px; font-weight: 600; }
.led-head .receipt-ref { white-space: nowrap; }
.led-fees { flex: 0 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; }
.led-fees::-webkit-scrollbar { display: none; }
.led-foot { flex: none; }
.led .ledger-row { grid-template-columns: minmax(0, 1fr) auto; font-size: var(--led-size); padding: 9px 10px; }
.led .ledger-what small { font-size: 13px; }
.led .ledger-what time { font-variant-numeric: tabular-nums; }
.led .ledger-row.is-new { animation-delay: .45s; }
.led-none { display: block !important; color: var(--muted); }
.led-sub { margin: 10px 10px 2px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.led-costs .ledger-row { padding: 6px 10px; font-size: calc(var(--led-size) - 1px); }
.led-costs .ledger-what { color: var(--ink-2); }
.led .ledger-total { margin: 8px 10px 0; padding: 10px 0 0; font-size: var(--led-size); }
.led .ledger-total .amt { font-size: 22px; }

/* Beat 10: model card over the lower half */
.mcard {
  position: absolute; left: var(--pad-x); right: var(--pad-x); bottom: 0; min-height: 46%; z-index: 15;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); align-content: center; box-sizing: border-box; padding: 28px 0 26px;
}
/* The stage behind the card steps back, and its cut edge fades out instead of stopping mid-line. */
.mcard::before {
  content: ""; position: absolute; left: calc(-1 * var(--pad-x)); right: calc(-1 * var(--pad-x)); bottom: calc(100% + 1px); height: 72px;
  background: linear-gradient(to bottom, rgba(247, 247, 247, 0), var(--wash)); pointer-events: none;
}
@media (min-width: 900px) {
  .stage.has-card .pwrap, .stage.has-card .hold, .stage.has-card .led { opacity: .38; transition: opacity .25s linear; }
  /* The white card is painted by ::after, above a fade (::before) that turns solid wash 30px before the card and runs on
     under its rounded top corners, so the corners show plain wash and the fade has no hard line. Hairline edge only. */
  .mcard { background: none; box-shadow: none; }
  .mcard::before { z-index: -1; bottom: calc(100% - var(--r-sheet)); height: calc(110px + var(--r-sheet));
    background: linear-gradient(to bottom, rgba(247, 247, 247, 0) 0, var(--wash) calc(100% - 30px - var(--r-sheet))); }
  .mcard::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--paper);
    border-radius: var(--r-sheet) var(--r-sheet) 0 0; box-shadow: 0 0 0 1px var(--line); pointer-events: none; }
}
.stage[data-arrive="fwd"] .mcard { animation: card-up .42s var(--ease-move) both; }
@keyframes card-up { from { transform: translateY(28px); opacity: 0; } }
.mc-deal, .mc-year { padding: 0 32px; min-width: 0; display: grid; align-content: start; gap: 12px; }
.mc-year { border-left: 1px solid var(--line); }
.mc-h { font-size: 20px; font-weight: 600; }
.mc-yhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.mc-yhead span { font-size: 14px; color: var(--muted); white-space: nowrap; }
.mc-deal .receipt { font-size: 16px; }
.mc-deal .rc-row { padding: 6px 0; }
.mc-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 32px; align-items: end; }
.mc-deals { margin: 0; font-size: 17px; color: var(--ink-2); font-weight: 500; }
.mc-deals b { font-family: var(--font-display); font-weight: 600; font-size: 30px; letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.mc-total { --amt-size: 68px; display: block; margin-top: 2px; }
.mc-total-label { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.mc-lines { font-size: 16px; }
.mc-prem { transition: opacity .3s linear; }
.mc-prem.is-off { opacity: 0; }
.mc-foot { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.45; }

/* ------------------------------------------------------------------ presenter controls */
.controls {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 24px;
  min-height: var(--ctl-h); padding: 0 var(--pad-x); background: var(--paper); border-top: 1px solid var(--line);
  position: relative; z-index: 20; box-sizing: border-box;
}
.ctl-nav { display: flex; align-items: center; gap: 12px; }
.ctl-count { font-size: 15px; font-weight: 600; min-width: 108px; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.controls .btn { gap: 8px; }
.controls kbd { height: 20px; min-width: 20px; font-size: 11px; padding: 0 5px; }
.btn-ink { background: var(--ink); color: #fff; }
.btn-ink:hover:not(:disabled) { background: #000; }
.btn-ink kbd { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .28); color: #fff; }
.ctl-mid { min-width: 0; display: flex; justify-content: center; }
.ticks { list-style: none; display: flex; gap: 3px; margin: 0; padding: 0; }
.tick { width: 30px; height: 30px; display: grid; place-items: center; border: 0; padding: 0; background: none; border-radius: 6px; }
.tick span { display: block; width: 24px; height: 4px; border-radius: 2px; background: var(--line-2); }
.tick.is-done span { background: var(--ink); }
.tick.is-now span { background: var(--brand); height: 6px; }
.caption {
  margin: 0; font-size: 16px; line-height: 1.25; color: var(--ink); text-align: center; text-wrap: balance;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.ctl-keys { display: flex; align-items: center; gap: 2px; }
.ctl-keys .btn { color: var(--ink-2); text-decoration: none; padding: 0 9px; }
.ctl-keys .btn[aria-pressed="true"] { color: var(--brand-deep); background: var(--brand-tint); }

/* ------------------------------------------------------------------ phone screens (designed at 360 x 680) */
.phone-body { background: var(--paper); }
.scr { position: relative; min-height: 100%; display: flex; flex-direction: column; padding: 4px 20px 0; box-sizing: border-box; }
.scr-main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 14px; padding-bottom: 14px; }
.scr-foot { position: sticky; bottom: 0; display: grid; gap: 8px; padding: 10px 0 30px; background: var(--paper); }
.scr p { margin: 0; }
.app-bar { display: flex; align-items: center; gap: 6px; height: 34px; font-size: 15px; font-weight: 600; margin-left: -4px; }
.app-bar svg { width: 20px; height: 20px; }
.scr-title { font-size: 24px; font-weight: 600; letter-spacing: -.025em; line-height: 1.15; margin: 0; }
.scr-sub { font-size: 14px; color: var(--muted); line-height: 1.4; text-wrap: pretty; }
.scr-text { font-size: 15px; color: var(--ink-2); line-height: 1.42; text-wrap: pretty; }
/* max-width: none, or hold.css's img { max-width: 100% } stops the photo short and leaves a strip on its right. */
.scr-photo { display: block; width: calc(100% + 40px); max-width: none; height: 148px; margin: -4px -20px 0; object-fit: cover; }
.scr .chip { justify-self: start; }
.scr .amt-hero { --amt-size: 46px; }
.foot-note { font-size: 13px; color: var(--muted); text-align: center; }
.price-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.price { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: -.03em; }
.price small { font-family: var(--font-ui); font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.badges { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.badges .badge { font-size: 14.5px; white-space: normal; align-items: flex-start; line-height: 1.3; }
.badges .badge svg { margin-top: 1px; }
.badges small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
.badges-2 { grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.badges-2 .badge { font-size: 13.5px; }
.hr { height: 1px; background: var(--line); }
.mini { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; }
.mini img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
.mini strong { display: block; font-size: 15px; }
.mini span { font-size: 13px; color: var(--muted); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; font-size: 15px; line-height: 1.35; }
.checks svg { width: 20px; height: 20px; color: var(--verified); }
.checks small { display: block; font-size: 13px; color: var(--muted); }
.box { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.box .receipt { font-size: 14.5px; }
.box .rc-row { padding: 5px 0; }
.box .rc-total { padding-top: 9px; }
.box .rc-total > :last-child { font-size: 18px; }
.box-title { font-size: 15px; font-weight: 600; margin-bottom: 4px !important; }
.row-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left;
  padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--paper);
}
.row-btn strong { display: block; font-size: 15.5px; }
.row-btn small { display: block; font-size: 13px; color: var(--muted); font-weight: 400; }
.row-btn svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.dl { display: grid; margin: 0; }
.dl > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
.dl > div:last-child { border-bottom: 1px solid var(--line); }
.dl dt { color: var(--ink-2); }
.dl dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.scr .steps .step { padding-bottom: 15px; }
.scr .steps .step-title { font-size: 15px; }
.scr .steps .step:last-child { padding-bottom: 0; }
.scr .held-item { padding: 12px 14px; }
.scr .slot-empty { font-size: 14px; }
.scr .slot-empty strong { color: var(--ink); display: block; font-size: 15px; }
.upcoming { display: grid; gap: 2px; }
.upcoming-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 15px; }
.upcoming-top .amt { font-family: var(--font-display); font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.day-big { font-family: var(--font-display); font-weight: 600; font-size: 40px; letter-spacing: -.03em; line-height: 1.05; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.photos figure { margin: 0; position: relative; }
.photos img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 10px; }
.photos .ok { position: absolute; right: 6px; bottom: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--verified); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 2px #fff; }
.photos .ok svg { width: 13px; height: 13px; }
.timer { display: grid; gap: 2px; padding: 14px 16px 15px; border-radius: 14px; background: var(--wash); }
.timer-num { font-family: var(--font-display); font-weight: 600; font-size: 44px; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.timer-text { font-size: 15px; font-weight: 600; }
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.reasons li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); font-size: 14.5px; color: var(--ink-2); }
.reasons li.on { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-2); box-sizing: border-box; flex: none; }
.on > .radio { border: 5.5px solid var(--ink); }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 18px 1fr auto; gap: 12px; align-items: center; padding: 10px 13px; border-radius: 12px; border: 1px solid var(--line); font-size: 15px; }
.opt.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt small { display: block; font-size: 12.5px; color: var(--muted); }
.opt .amt { font-weight: 600; }
.opt-label { font-size: 13.5px; font-weight: 600; color: var(--muted); }
.rows { list-style: none; margin: 0; padding: 0; display: grid; }
.rows li { display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; }
.rows time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rows small { display: block; font-size: 12.5px; color: var(--muted); }
.rows .amt { font-weight: 600; }
.rows .rows-total { grid-template-columns: 1fr auto; border-top: 1px solid var(--ink); font-weight: 700; }
.record { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--verified-tint); }
.record-ic { width: 40px; height: 40px; border-radius: 50%; background: var(--paper); color: var(--verified-ink); display: grid; place-items: center; }

.record span { font-size: 13px; color: var(--ink-2); }
/* A tapped phone button shows its result; longer results wrap inside the phone instead of running off its edge. */
.btn.is-acked { color: var(--verified-ink); border-color: var(--verified-tint); background: var(--verified-tint); cursor: default;
  white-space: normal; text-align: center; line-height: 1.3; padding: 8px 14px; text-wrap: balance; }
.claim-line { display: grid; gap: 6px; }
.claim-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 16px; font-weight: 600; }

/* lock screen */
.lock { position: absolute; inset: 0; background: var(--wash); display: grid; align-content: start; justify-items: center; padding-top: 64px; text-align: center; }
.lock-date { font-size: 17px; font-weight: 500; color: var(--ink-2); margin: 0; }
.lock-time { font-family: var(--font-display); font-weight: 600; font-size: 84px; letter-spacing: -.045em; line-height: 1; margin: 4px 0 0; color: var(--ink); }
/* a push notification on the lock screen (Lena, beat 8); tapping it opens the app */
.notif {
  width: calc(100% - 24px); margin-top: 30px; box-sizing: border-box; display: grid; gap: 5px; padding: 12px 15px 14px;
  border: 0; border-radius: 20px; background: var(--paper); color: var(--ink); font: inherit; text-align: left;
  box-shadow: 0 1px 2px rgba(17, 17, 17, .06), 0 12px 28px -14px rgba(17, 17, 17, .28);
}
.notif-top { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--muted); }
.notif-top .vm-mark { width: 22px; height: 22px; }
.notif-top .vm-mark svg { width: 12px; height: 12px; }
.notif-top span:nth-child(2) { color: var(--ink-2); font-weight: 600; }
.notif-top time { margin-left: auto; }
.notif strong { font-size: 16px; line-height: 1.3; }
.notif .notif-day { font-size: 15px; font-weight: 600; color: var(--brand-deep); }
.notif .notif-body { font-size: 14.5px; color: var(--ink-2); line-height: 1.42; text-wrap: pretty; }

/* in-phone sheets (pay sheet, Lena's receipt) */
.p-under { position: absolute; inset: 0; }
.p-scrim { position: absolute; inset: 0; background: rgba(17, 17, 17, .34); }
.p-sheet {
  position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: 12px; padding: 8px 20px 30px;
  background: var(--paper); border-radius: var(--r-sheet) var(--r-sheet) 0 0; box-shadow: var(--sh-sheet);
}
.p-sheet p { margin: 0; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line-2); justify-self: center; margin-bottom: 4px; }
.p-sheet .receipt { font-size: 15px; }
.p-sheet .rc-row { padding: 5px 0; }
.stage[data-arrive="fwd"] .slide-up { animation: slide-up .44s var(--ease-move) both .12s; }
.stage[data-arrive="fwd"] .p-scrim { animation: fade-in .3s linear both; }
@keyframes slide-up { from { transform: translateY(100%); } }
@keyframes fade-in { from { opacity: 0; } }
.stage[data-arrive="fwd"] .tick-in { animation: tick-in .26s var(--ease-move) both; }
@keyframes tick-in { from { opacity: 0; transform: translateY(6px); } }

/* ------------------------------------------------------------------ desktop shell: one screen, nothing scrolls */
@media (min-width: 900px) {
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  #hold-nav { flex: none; }

  .stage { overflow: hidden; }
  .phone-label { display: none; }
}
/* 1024-1150 wide: the bar cells are too narrow to park a travelling amount beside the balance, so it sits under it. */
@media (min-width: 900px) and (max-width: 1150px) {

  /* the beat ticks shrink to fit between Next and the key buttons; the date chip may wrap its time under the date */
  .ticks { width: 100%; max-width: 330px; }

  .tick span { width: calc(100% - 4px); }
  .date-chip { max-width: 100%; box-sizing: border-box; flex-wrap: wrap; row-gap: 0; white-space: normal; border-radius: 14px; }
}
/* Cramped center column (narrow or short window): the what-if decision keeps its button and drops the explainer line. */
@media (min-width: 900px) and (max-width: 1150px), (min-width: 900px) and (max-height: 700px) {
  .decide-note { display: none; }
}
/* Projector (1280x720) and other short screens: tighter chrome, same readable text (body >= 15px, key amounts >= 28px). */

  .phone { --phone-h: 640px; }

}

    --hold-amt: 32px; --hold-text: 16px; --led-size: 16.5px; --stage-pt: 26px; --stage-pb: 22px; --ctl-h: 64px; --mv-h: 32px; --mv-size: 15.5px; }

/* ------------------------------------------------------------------ stacked layout under 900px */
@media (max-width: 899.98px) {
  :root { --pad-x: 16px; --gap: 12px; --bar-py: 9px; --bar-amt: 21px; --bar-label: 12.5px; --head-title: 22px; --mv-h: 22px; --mv-size: 12.5px; }
  body { padding-bottom: 64px; }
  .bar { position: sticky; top: 0; grid-template-columns: 1fr 1fr; row-gap: 18px; }

  .cell-note { display: none; }
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "card" "pj" "pl" "hold" "led"; row-gap: 22px; grid-template-rows: none; padding-top: 18px; padding-bottom: 24px; }
  .head { padding-bottom: 0; }
  .pwrap { display: grid; justify-items: center; }
  .phone-label { justify-self: start; margin-bottom: 10px; }
  .mcard::before { content: none; }

  .mc-deal, .mc-year { padding: 0 18px; }

  .controls { position: fixed; left: 0; right: 0; bottom: 0; grid-template-columns: 1fr auto; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); min-height: 0; }
  .ctl-mid, .controls kbd, .ctl-keys [data-act="damage"], .ctl-keys [data-act="caption"] { display: none; }
  .ctl-nav { gap: 6px; }

  .controls .btn { min-height: 40px; padding: 0 12px; }

}

/* ------------------------------------------------------------------ reduced motion: jump to the end state */
@media (prefers-reduced-motion: reduce) {
  .amt-swap, .stage[data-arrive="fwd"] .mcard, .stage[data-arrive="fwd"] .slide-up, .stage[data-arrive="fwd"] .p-scrim,

<body>
<div id="hold-nav"><span class="tag-test">Test money</span></div>

      <figcaption class="phone-label" id="plLabel"></figcaption>

        <div class="phone-status"><span id="timeL">9:20</span><span class="phone-icons" aria-hidden="true"></span></div>

      </div></div>

<script src="assets/hold-data.js"></script>
<script src="assets/hold-nav.js"></script>
<script>
(function () {
  'use strict';
  const H = window.HOLD;
  if (!H) { document.getElementById('title').textContent = 'The demo data (assets/hold-data.js) did not load.'; return; }

  /* ------------------------------------------------------------------ shorthands */
  const m = H.money, d = H.date, D = H.deal, DL = D.deadlines, T = H.totals, V = H.vocab;
  const J = H.people.renter, L = H.people.lister, O = H.people.owner;
  const WI = H.branches.whatIf, DM = H.branches.damage;
  const FROZEN = WI.states[0], REFUND = WI.states[1], CLAIM = DM.states[0];
  const b = (n) => H.beat(n);
  const $ = (s, r) => (r || document).querySelector(s);
  // Product terms, counts, dates and times never split across lines ("All good", "Day 0 of 14", "on time 1/1",
  // "Mon, May 24", "11:05 AM", "24 h", "1 day").
  const NB = ' ';
  const KEEP = /\b(All good|Broken blind|Report a problem|Claim deductions|Day \d+ of 14|on time)\b/g;
  const tidy = (s) => String(s)
    .replace(KEEP, (x) => x.replace(/ /g, NB))
    .replace(/ (AM|PM)\b/g, NB + '$1')
    .replace(/\b(Mon|Tue|Wed|Thu|Fri|Sat|Sun), (?=[A-Z])/g, '$1,' + NB)
    .replace(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec) (\d)/g, '$1' + NB + '$2')
    .replace(/\b(\d+) (days?|h|business)\b/g, '$1' + NB + '$2')
    .replace(/ (\d+\/\d+)$/, NB + '$1');
  const keep = tidy;
  const esc = (s) => tidy(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const desk = matchMedia('(min-width: 900px)');
  const clock = (at) => d(at, 'time').replace(/\s?[AP]M$/, '');
  const dayAt = (at) => d(at, 'day') + ' at ' + d(at, 'time');
  const UP = D.upfront.total, FEE = D.listerFee, RATE = Math.round(H.fees.listerRate * 100) + '%';
  const hero = (c) => H.moneyHTML(c, { hero: true });
  const FF_MS = 280;   // beat 7: one month per step, date chip and Lena's rent rows in sync

  /* ------------------------------------------------------------------ icons (24 viewBox, stroke) */
  const svg = (p, extra) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (extra || '') + '>' + p + '</svg>';
  const I = {
    cap: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 1.5 8.5 12 14l8.5-4.46V16h2V8.5z"/><path d="M5.5 12.6v3.6c0 1.6 2.9 3.3 6.5 3.3s6.5-1.7 6.5-3.3v-3.6L12 16z"/></svg>',
    face: svg('<circle cx="12" cy="12" r="9"/><path d="m8 12.3 2.7 2.7L16 9.6"/>', ' stroke-width="2.2"'),
    house: svg('<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="m8.5 14 2.5 2.5 4.5-5"/>'),
    ret: svg('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'),
    check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>', ' stroke-width="2.6"'),
    checkCircle: svg('<circle cx="12" cy="12" r="9.5" fill="currentColor" stroke="none"/><path d="m7.8 12.3 2.8 2.8 5.6-5.8" stroke="#fff" stroke-width="2.2"/>'),
    back: svg('<path d="m15 18-6-6 6-6"/>', ' stroke-width="2.2"'),
    chev: svg('<path d="m9 18 6-6-6-6"/>', ' stroke-width="2.2"'),
    share: svg('<path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>')
  };
  const MARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="m8.5 14 2.5 2.5 4.5-5"/></svg>';
  const BADGE = {
    'Student verified': ['badge-student', I.cap],
    'Face verified': ['badge-verified', I.face],
    'Owner approved sublet': ['badge-owner', I.house],
    'Deposits returned on time': ['badge-owner', I.ret]
  };
  const badge = (label, small) => { const k = BADGE[label] || ['', I.face]; return '<li class="badge ' + k[0] + '">' + k[1] + '<span>' + esc(label) + (small ? '<small>' + esc(small) + '</small>' : '') + '</span></li>'; };
  // A phone button with no next step gives a visible result instead of doing nothing.
  const ackBtn = (label, done, cls) => '<button class="btn ' + cls + '" type="button" data-act="ack" data-done="' + esc(done) + '">' + label + '</button>';

  /* ------------------------------------------------------------------ small builders */
  const rc = (label, cents, cls, note, opts) => '<div class="rc-row ' + (cls || '') + '"><span>' + esc(label) + (note ? '<small class="rc-note">' + esc(note) + '</small>' : '') + '</span><span class="amt">' + m(cents, opts) + '</span></div>';
  const stepLi = (n, title, meta, cls) => '<li class="step ' + (cls || '') + '"><span class="step-dot">' + n + '</span><div class="step-body"><p class="step-title">' + esc(title) + '</p>' + (meta ? '<p class="step-meta">' + esc(meta) + '</p>' : '') + '</div></li>';
  const dl = (rows) => '<dl class="dl">' + rows.map((r) => '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>').join('') + '</dl>';
  const person = (p, meta) => '<div class="person"><img class="avatar" src="' + p.img + '" alt="' + esc(p.alt) + '"><div><p class="person-name">' + esc(p.name) + '</p><p class="person-meta">' + esc(meta) + '</p></div></div>';
  const btn = (label, act, cls) => '<button class="btn ' + cls + '" type="button" data-act="' + act + '">' + esc(label) + '</button>';
  const scr = (main, foot, before) => (before || '') + '<div class="scr"><div class="scr-main">' + main + '</div>' + (foot ? '<div class="scr-foot">' + foot + '</div>' : '') + '</div>';
  const appBar = (t) => '<div class="app-bar">' + I.back + '<span>' + esc(t) + '</span></div>';
  const shortLabel = (s) => s.replace(/\s*\(.*\)$/, '');

  /* ------------------------------------------------------------------ steps
   * Each step is one presenter state. Beats 1-10 follow final-model.md section H; beat 3 has a pay-sheet step first
   * so the money only moves when Pay is tapped. `from` + `moves` = money that travels when arriving from that step. */
  const payState = Object.assign({}, b(2), { at: b(3).at, dateLabel: b(3).dateLabel, timeLabel: b(3).timeLabel });
  // Beat 9 opens on May 21 with the deposit still held and Lena's Return button showing; her tap moves the money.
  const returnState = Object.assign({}, b(8), { at: b(9).at, dateLabel: b(9).dateLabel, timeLabel: b(9).timeLabel });
  // Day N of 14 after move-out, by calendar day (Day 0 = the day Jamie taps I've moved out).
  const dayN = (at) => H.date.diffDays(DL.movedOut, at);
  const MAIN = ['beat-1', 'beat-2', 'beat-3-pay', 'beat-3', 'beat-4', 'beat-5', 'beat-6', 'beat-7', 'beat-8', 'beat-9-return', 'beat-9', 'beat-10'];
  const STEPS = {
    'beat-1': { beat: 1, st: b(1), j: 'lock', l: 'list', idle: 'j' },
    'beat-2': { beat: 2, st: b(2), j: 'listing', l: 'live', idle: 'l' },
    'beat-3-pay': { beat: 3, st: payState, j: 'pay', l: 'live', idle: 'l', title: 'Jamie books with Hold', say: b(3).say },
    'beat-3': { beat: 3, st: b(3), j: 'paid', l: 'booked', from: 'beat-3-pay', moves: [['jamie', 'held', 'held']] },
    'beat-4': { beat: 4, st: b(4), j: 'tracker', l: 'booked', idle: 'l' },
    'beat-5': { beat: 5, st: b(5), j: 'movein', l: 'waiting', idle: 'l' },
    'beat-6': { beat: 6, st: b(6), j: 'released', l: 'receipt', from: 'beat-5', moves: [['held', 'lena', 'rel'], ['held', 'verimate', 'fee']] },
    'beat-7': { beat: 7, st: b(7), j: 'rent', l: 'rent', from: 'beat-6', moves: [['jamie', 'lena', 'direct']] },

      '<div class="receipt">' + rc('Deposit', D.deposit) + rc(DM.claim.label, -DM.claim.cents, 'rc-sub') + rc('Returned to Jamie now', S.st.renterBack, 'rc-total') + '</div>' +

  };

  /* ------------------------------------------------------------------ Verimate ledger */
  function costGroups(rows) {
    const g = [{ label: 'ID and face checks', cents: 0, n: 0 }, { label: 'Stripe', cents: 0, parts: [] }, { label: 'Risk reserve', cents: 0 }];
    rows.filter((r) => r.kind === 'cost').forEach((r) => {
      if (r.id.indexOf('id-') === 0) { g[0].cents += r.cents; g[0].n++; }
      else if (r.id === 'reserve') g[2].cents += r.cents;
      else { g[1].cents += r.cents; g[1].parts.push(r.id === 'ach-in' ? 'bank in' : r.id.indexOf('pay') === 0 ? 'payout' : 'account'); }
    });
    g[0].note = g[0].n === 2 ? 'Lena and Jamie' : 'Lena';
    const cnt = (w) => g[1].parts.filter((p) => p === w).length;
    g[1].note = ['bank in', 'payout', 'account'].filter(cnt).map((w) => cnt(w) > 1 ? w + 's' : w).join(', ');
    g[1].note = g[1].note.charAt(0).toUpperCase() + g[1].note.slice(1);
    return g.filter((x) => x.cents !== 0);
  }
  // The four no-fee rent payments (Feb to May) read as one ledger line, so the panel stays short enough to show its total.
  const DIRECT_IDS = ['fee-feb', 'fee-mar', 'fee-apr', 'fee-may'];
  function feeRows(rows) {
    const out = [];
    rows.filter((r) => r.kind !== 'cost').forEach((r) => {
      if (DIRECT_IDS.indexOf(r.id) < 0) { out.push(r); return; }
      if (out.some((x) => x.id === 'direct')) return;
      const all = rows.filter((x) => DIRECT_IDS.indexOf(x.id) >= 0);
      out.push({ id: 'direct', at: all[0].at, label: 'Feb–May rent to Lena', note: all.length + ' payments, ' + m(D.directRent), cents: all.reduce((s, x) => s + x.cents, 0), kind: 'nofee' });
    });
    return out;
  }
  const lcFirst = (s) => /^[A-Z][a-z]/.test(s) ? s.charAt(0).toLowerCase() + s.slice(1) : s;
  function ledgerHTML(S, prevSt, fresh) {
    const st = S.st, rows = st.ledgerRows;
    const fees = feeRows(rows);
    const old = new Set(prevSt ? feeRows(prevSt.ledgerRows).map((r) => r.id) : []);
    const isNew = (r) => fresh && prevSt && !old.has(r.id);
    const groups = costGroups(rows), oldGroups = prevSt ? costGroups(prevSt.ledgerRows) : [];
    const gNew = (g) => fresh && prevSt && !oldGroups.some((x) => x.label === g.label && x.cents === g.cents);
    return '<div class="led-head"><h2>Verimate ledger</h2><span class="receipt-ref">' + esc(D.ref) + '</span></div>' +
      '<div class="led-fees"><ol class="ledger">' + (fees.length ? fees.map((r) =>
        '<li class="ledger-row ' + (r.kind === 'fee' ? 'is-fee' : 'is-zero') + (isNew(r) ? ' is-new' : '') + '">' +
        '<span class="ledger-what">' + esc(r.label) + '<small>' + (r.id === 'direct' ? esc(r.note) : '<time datetime="' + r.at + '">' + esc(d(r.at, 'short')) + '</time>' +
        (r.note ? ', ' + esc(lcFirst(r.note)) : '')) + '</small></span><span class="ledger-amt amt">' + m(r.cents) + '</span></li>').join('')
        : '<li class="ledger-row led-none">No fees yet. Lena pays only after <span class="nw">move-in.</span></li>') + '</ol></div>' +
      '<div class="led-foot"><p class="led-sub">Costs</p><ol class="ledger led-costs">' + groups.map((g) =>
        '<li class="ledger-row is-cost' + (gNew(g) ? ' is-new' : '') + '"><span class="ledger-what">' + esc(g.label) + '<small>' + esc(g.note || 'ACH returns, disputes') + '</small></span><span class="ledger-amt amt">' + m(g.cents) + '</span></li>').join('') + '</ol>' +
      '<div class="ledger-total"><span>' + (S.id === 'beat-10' ? 'Kept on this deal' : 'Kept so far') + '</span><span class="amt">' + m(st.verimateNet) + '</span></div></div>';
  }

  /* ------------------------------------------------------------------ beat 10: model card */
  const B10 = b(10), RUN = B10.run, Y1 = H.year1;
  const CARD_NOTE = {
    "Jamie's fees": 'Rent only, ' + m(T.renterNet),
    'Verimate costs': 'Stripe ' + m(T.stripe) + ', ID checks ' + m(T.idChecks) + ', reserve ' + m(T.riskReserve),
    'Verimate kept': T.verimateMargin + ' of the fee'
  };
  const mcard = $('#mcard');
  mcard.innerHTML =
    '<div class="mc-deal"><h2 class="mc-h">This deal, ' + esc(D.address) + '</h2><div class="receipt">' +
    // Costs are shown as a minus, so the column adds up: $0.00 + $87.50 − $21.66 = $65.84 kept.
    B10.card.map((x) => {
      const cost = /costs$/.test(x.label), c = cost ? -x.cents : x.cents;
      return rc(x.label, c, x.total ? 'rc-total' : cost ? 'rc-sub' : c === 0 ? 'rc-zero' : '', x.note || CARD_NOTE[x.label]);
    }).join('') + '</div></div>' +
    '<div class="mc-year"><div class="mc-yhead"><h2 class="mc-h">' + esc(RUN.label) + '</h2><span>' + esc(Y1.period) + '</span></div>' +
    '<div class="mc-grid"><div><p class="mc-deals"><b id="mcDeals">' + RUN.toDeals + '</b> deals</p><span class="amt amt-hero mc-total" id="mcTotal"></span><p class="mc-total-label">Revenue, year 1</p></div>' +
    '<div class="receipt mc-lines"><div class="rc-row"><span id="mcFeeLabel"></span><span class="amt" id="mcFees"></span></div>' +
    '<div class="rc-row mc-prem" id="mcPrem"><span>' + esc(Y1.lines[1].label) + '</span><span class="amt">' + m(RUN.premium, { cents: false }) + '</span></div>' +
    '<div class="rc-row rc-sub"><span>Break-even before salaries</span><span class="amt">about ' + Y1.breakEvenWithPremium + ' deals</span></div></div></div>' +
    '<p class="mc-foot">' + esc(Y1.assumptions[0].value.replace(/^280 = /, RUN.toDeals + ' deals is ')) + '. Same fee at ' + H.threeYear[1].campuses + ' campuses in year 2: ' +
    m(H.threeYear[1].revenue, { k: true }) + '. At ' + H.threeYear[2].campuses + ' in year 3: ' + m(H.threeYear[2].revenue, { k: true }) + '.</p></div>';
  const mc = { deals: $('#mcDeals'), total: $('#mcTotal'), feeLabel: $('#mcFeeLabel'), fees: $('#mcFees'), prem: $('#mcPrem') };
  let countRAF = 0;
  function setCount(n, prem, showPrem) {
    const fees = n * RUN.perDeal;
    mc.deals.textContent = n.toLocaleString('en-US');
    mc.feeLabel.textContent = 'Lister fees, ' + n.toLocaleString('en-US') + ' × ' + m(RUN.perDeal, { cents: false });
    mc.fees.textContent = m(fees, { cents: false });
    mc.total.innerHTML = H.moneyHTML(fees + prem, { cents: false }).replace(/^<span class="amt">|<\/span>$/g, '');
    mc.prem.classList.toggle('is-off', !showPrem);
  }
  function runCount() {
    cancelAnimationFrame(countRAF);
    if (reduce.matches) { setCount(RUN.toDeals, RUN.premium, true); return; }
    setCount(RUN.fromDeals, 0, false);
    const ease = (p) => 1 - Math.pow(1 - p, 3);
    const t0 = performance.now() + 520, T1 = 1800, T2 = 520;
    const tick = (now) => {
      const t = now - t0;
      if (t >= T1 + T2) { setCount(RUN.toDeals, RUN.premium, true); return; }
      if (t >= T1) setCount(RUN.toDeals, Math.round(RUN.premium * ease((t - T1) / T2)), true);
      else if (t > 0) setCount(Math.max(RUN.fromDeals, Math.round(RUN.fromDeals + (RUN.toDeals - RUN.fromDeals) * ease(t / T1))), 0, false);
      countRAF = requestAnimationFrame(tick);
    };
    countRAF = requestAnimationFrame(tick);
  }
  setCount(RUN.toDeals, RUN.premium, true);
  // The counter must land exactly on the data's year-1 revenue, and the deal column must add up to what Verimate kept.
  if (RUN.toDeals * RUN.perDeal + RUN.premium !== RUN.total || RUN.total !== Y1.revenue) console.error('hold.html: beat 10 counter does not match HOLD.year1.revenue');
  const cardSum = B10.card.filter((x) => !x.total).reduce((s, x) => s + (/costs$/.test(x.label) ? -x.cents : x.cents), 0);
  if (cardSum !== B10.card.filter((x) => x.total)[0].cents || cardSum !== B10.verimateNet) console.error('hold.html: beat 10 card does not add up to Verimate kept');

  /* ------------------------------------------------------------------ controls */
  const stage = $('#stage'), title = $('#title'), live = $('#live');
  const ticks = $('#ticks'), caption = $('#caption'), count = $('#count');
  ticks.innerHTML = H.beats.map((x) => '<li><button class="tick" type="button" data-act="go:beat-' + x.n + '" aria-label="Go to beat ' + x.n + ': ' + esc(x.title) + '"><span></span></button></li>').join('');
  $('#pjLabel').innerHTML = '<img class="avatar" src="' + J.img + '" alt=""><span><strong>' + esc(J.name) + '</strong> ' + esc(J.role) + '</span>';
  $('#plLabel').innerHTML = '<img class="avatar" src="' + L.img + '" alt=""><span><strong>' + esc(L.name) + '</strong> ' + esc(L.role) + '</span>';
  const pj = $('#pj'), pl = $('#pl'), scrJ = $('#scrJ'), scrL = $('#scrL');

  let cur = null, nav = 0, active = null, captionOn = false, cardHidden = false;
  const origin = { whatif: 'beat-5', damage: 'beat-9-return' };

  function showCard(on) { mcard.hidden = !on; stage.classList.toggle('has-card', on); }

  function renderControls(S) {
    const n = S.beat;
    count.innerHTML = n ? '<span class="w">Beat </span>' + n + ' of 10' : S.branch === 'whatif' ? (S.id === 'what-if' ? 'What if, 1 of 2' : 'What if, 2 of 2') : 'Damage claim';
    const ob = n || (STEPS[origin[S.branch]] || {}).beat || 0;
    Array.prototype.forEach.call(ticks.querySelectorAll('.tick'), (t, i) => {
      t.classList.toggle('is-done', i + 1 < ob || (!n && i + 1 === ob));
      t.classList.toggle('is-now', !!n && i + 1 === n);
      if (n && i + 1 === n) t.setAttribute('aria-current', 'step'); else t.removeAttribute('aria-current');
    });
    $('#backBtn').disabled = !S.prev && !S.branch;
    const atEnd = S.id === 'beat-10';
    $('#nextLabel').textContent = atEnd ? (cardHidden ? 'Show card' : 'Run again') : 'Next';
    $('#nextBtn').disabled = !atEnd && !S.next;
    // Only the presenter-bar buttons are toggles; the phones carry buttons with the same data-act.
    $('.ctl-keys [data-act="whatif"]').setAttribute('aria-pressed', String(S.branch === 'whatif'));
    $('.ctl-keys [data-act="damage"]').setAttribute('aria-pressed', String(S.branch === 'damage'));
    $('.ctl-keys [data-act="caption"]').setAttribute('aria-pressed', String(captionOn));
    caption.textContent = S.say || '';
    caption.hidden = !captionOn;
    ticks.hidden = captionOn;
  }

  /* ------------------------------------------------------------------ date chip (beat 7 fast-forwards Feb to May) */
  const dateChip = $('#dateChip');
  let ffTimer = 0;
  const chipHTML = (label, time) => esc(label) + (time ? '<span class="date-chip-time">' + esc(time) + '</span>' : '');
  function renderDate(st, fastForward) {
    clearInterval(ffTimer);
    dateChip.classList.remove('is-ff');
    if (!fastForward) { dateChip.innerHTML = chipHTML(st.dateLabel, st.timeLabel); return; }
    // One step per rent payment, in time with the rows ticking in on Lena's phone, then the whole range.
    const seq = st.ticks.map((t) => d(t, 'year'));
    let k = 0;
    dateChip.classList.add('is-ff');
    dateChip.innerHTML = chipHTML(seq[0]);
    ffTimer = setInterval(() => {
      k++;
      if (k < seq.length) { dateChip.innerHTML = chipHTML(seq[k]); return; }
      clearInterval(ffTimer);
      dateChip.classList.remove('is-ff');
      dateChip.innerHTML = chipHTML(st.dateLabel, st.timeLabel);
    }, FF_MS);
  }

  /* ------------------------------------------------------------------ render one step */
  function render(id, o) {
    o = o || {};
    const S = STEPS[id], st = S.st;
    const focusWasIn = stage.contains(document.activeElement);
    document.documentElement.dataset.step = id;
    stage.dataset.arrive = o.arrive === 'fwd' && !reduce.matches ? 'fwd' : 'none';
    renderBar(S, o);
    renderDate(st, stage.dataset.arrive === 'fwd' && st.ticks && st.ticks.length);
    title.textContent = keep(S.title);
    $('#hold').innerHTML = HOLDC[id](S);
    scrJ.innerHTML = J_SCR[S.j](S);
    scrL.innerHTML = L_SCR[S.l](S);
    scrJ.scrollTop = 0; scrL.scrollTop = 0;
    $('#timeJ').textContent = clock(st.at);
    $('#timeL').textContent = clock(st.at);
    pj.classList.toggle('is-idle', S.idle === 'j');
    pl.classList.toggle('is-idle', S.idle === 'l');
    $('#led').innerHTML = ledgerHTML(S, o.prevSt, o.arrive === 'fwd');
    showCard(!!S.card && !cardHidden);
    renderControls(S);
    holdEl.scrollTop = 0; checkOver();
    live.textContent = count.textContent + '. ' + S.title + '. ' + V.states.held + ' ' + m(st.held) + '. Verimate earned ' + m(st.verimateEarned) + '.';
    if (focusWasIn && (!document.activeElement || document.activeElement === document.body)) title.focus({ preventScroll: true });
  }

  /* ------------------------------------------------------------------ navigation with the travelling amounts */
  const sameMoney = (a, c) => SLOTS.every((k) => slotVal(a, k) === slotVal(c, k));
  function finishActive() {
    if (!active) return;
    const a = active; active = null;
    if (a.vt) { try { a.vt.skipTransition(); } catch (e) { /* already done */ } }
    if (a.anims) a.anims.forEach((x) => x.cancel());
    a.land();
  }

  function go(id, how) {
    if (!STEPS[id]) return;
    finishActive();
    cancelAnimationFrame(countRAF);
    const prevId = cur, A = prevId ? STEPS[prevId] : null, S = STEPS[id];
    const token = ++nav;
    let moves = [], dir = 'none';
    // Money travels when arriving from the step a move starts at, or from any step with the same money (beat 8 to the damage claim).
    if (how !== 'jump' && A && S.moves && (S.from === prevId || sameMoney(A.st, STEPS[S.from].st))) { moves = S.moves; dir = 'fwd'; }
    else if (how !== 'jump' && A && A.moves && (A.from === id || sameMoney(S.st, STEPS[A.from].st))) { moves = A.moves.map((x) => ({ i: x.i, from: x.to, to: x.from, kind: x.kind, cents: x.cents })); dir = 'back'; }
    cur = id;
    if (id === 'beat-10') cardHidden = false;
    if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    const prevSt = A ? A.st : null;
    const base = { arrive: dir === 'fwd' || (A && MAIN.indexOf(id) === MAIN.indexOf(prevId) + 1) ? 'fwd' : 'none', prevSt: prevSt, fade: !!A };
    const animate = moves.length && !reduce.matches && A;
    const after = () => { if (S.card && !cardHidden) runCount(); };
    if (!animate) { render(id, base); after(); return; }

    const arrivals = moves.map((x) => x.to);
    const opts = Object.assign({}, base, { holdSlots: arrivals, fromSt: prevSt });
    const land = () => {
      if (token !== nav) return;
      SLOTS.forEach((k) => setAmt(CELL[k].amt, m(slotVal(S.st, k)), true));
      document.querySelectorAll('.lane .mv').forEach((p) => { p.style.viewTransitionName = ''; });
      document.querySelectorAll('.lane .mv-temp').forEach((p) => p.remove());
      after();
    };
    // Back: the reverse pills land and disappear. Forward: the pill stays as the "+amount" next to the new balance.
    const addBackPills = (named) => moves.forEach((x) => {
      CELL[x.to].lane.insertAdjacentHTML('beforeend', pill(x, false));
      const p = CELL[x.to].lane.lastElementChild; p.classList.add('mv-temp');
      if (named) p.style.viewTransitionName = 'mv-' + x.i;
    });

    if (document.startViewTransition) {
      // Old snapshot: the amount sits in the paying slot.
      if (dir === 'fwd') moves.forEach((x) => { CELL[x.from].lane.insertAdjacentHTML('beforeend', pill(x, false)); CELL[x.from].lane.lastElementChild.style.viewTransitionName = 'mv-' + x.i; });
      else moves.forEach((x) => { const p = CELL[x.from].lane.querySelector('.mv[data-i="' + x.i + '"]'); if (p) p.style.viewTransitionName = 'mv-' + x.i; });
      let vt;
      try {
        vt = document.startViewTransition(() => {
          if (token !== nav) return;
          render(id, Object.assign({}, opts, { names: dir === 'fwd' }));
          if (dir === 'back') addBackPills(true);
        });
      } catch (e) { vt = null; }
      if (vt) {
        active = { vt: vt, land: land };
        vt.finished.finally(() => { if (active && active.vt === vt) { active = null; land(); } });
        return;
      }
    }
    // Fallback without View Transitions: measure, render, then slide each pill from where it started (transform only).
    const starts = moves.map((x) => {
      const lane = CELL[x.from].lane;
      let p = dir === 'back' ? lane.querySelector('.mv[data-i="' + x.i + '"]') : null, tmp = null;
      if (!p) { lane.insertAdjacentHTML('beforeend', pill(x, false)); p = tmp = lane.lastElementChild; }
      const r = p.getBoundingClientRect(); if (tmp) tmp.remove();
      return r;
    });
    render(id, opts);
    if (dir === 'back') addBackPills(false);
    const anims = moves.map((x, k) => {
      const p = dir === 'back' ? CELL[x.to].lane.querySelector('.mv-temp[data-i="' + x.i + '"]') : CELL[x.to].lane.querySelector('.mv[data-i="' + x.i + '"]');
      if (!p) return null;
      const r = p.getBoundingClientRect(), s = starts[k];
      return p.animate([{ transform: 'translate(' + (s.right - r.right) + 'px,' + (s.top - r.top) + 'px)' }, { transform: 'none' }], { duration: 560, easing: 'cubic-bezier(.2,.7,.2,1)' });
    }).filter(Boolean);
    active = { anims: anims, land: land };
    Promise.all(anims.map((x) => x.finished)).then(() => { if (active && active.anims === anims) { active = null; land(); } }, () => {});
  }

  const isMain = (id) => MAIN.indexOf(id) >= 0;
  function next() {
    const S = STEPS[cur];
    if (cur === 'beat-10') { if (cardHidden) { cardHidden = false; render(cur, {}); } runCount(); renderControls(S); return; }
    if (S.next) go(S.next);
  }
  function back() {
    const S = STEPS[cur];
    if (S.branch) { go(S.id === 'what-if-refund' ? 'what-if' : origin[S.branch]); return; }
    if (S.prev) go(S.prev);
  }
  function whatIf() {
    const S = STEPS[cur];
    if (S.branch === 'whatif') { go(origin.whatif, 'jump'); return; }
    origin.whatif = isMain(cur) ? cur : 'beat-5';
    go('what-if', 'jump');
  }
  function damage() {
    const S = STEPS[cur];
    if (S.branch === 'damage') { go(origin.damage, 'jump'); return; }
    origin.damage = isMain(cur) ? cur : 'beat-9-return';
    // From beat 8 or Lena's Return screen the $815.00 travels to Jamie; from anywhere else the bar simply changes.
    go('damage');
  }
  function reset() { cardHidden = false; go('beat-1', 'jump'); }
  function toggleCaption() { captionOn = !captionOn; renderControls(STEPS[cur]); }
  function escape() {
    const S = STEPS[cur];
    if (S.card && !cardHidden) { cardHidden = true; showCard(false); cancelAnimationFrame(countRAF); renderControls(S); return; }
    if (S.branch) go(origin[S.branch], 'jump');
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    const a = t.dataset.act;
    // A mouse click must not leave focus on the button, or the next Space/Enter would press it again instead of going forward.
    if (e.detail) t.blur();
    if (a === 'ack') { if (!t.classList.contains('is-acked')) { t.classList.add('is-acked'); t.textContent = t.dataset.done; } return; }
    if (a === 'next') next();
    else if (a === 'back') back();
    else if (a === 'whatif') whatIf();
    else if (a === 'damage') damage();
    else if (a === 'reset') reset();
    else if (a === 'caption') toggleCaption();
    else if (a.indexOf('go:') === 0) go(a.slice(3), 'jump');
  });
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.defaultPrevented) return;
    const t = e.target;
    if (t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
    const onButton = t.closest && t.closest('button, a');
    const k = e.key;
    if (k === 'PageDown' || k === 'ArrowRight' || ((k === ' ' || k === 'Enter' || k === 'Spacebar') && !onButton)) { e.preventDefault(); next(); }
    else if (k === 'PageUp' || k === 'ArrowLeft') { e.preventDefault(); back(); }
    else if (k === 'b' || k === 'B') whatIf();
    else if (k === 'd' || k === 'D') damage();
    else if (k === 'r' || k === 'R') reset();
    else if (k === 'c' || k === 'C') toggleCaption();
    else if (k === 'f' || k === 'F') toggleFull();
    else if (k === 'Escape') escape();
  });
  // F: fullscreen, so a projector browser that is not in F11 mode still gets the whole screen.
  function toggleFull() {
    const de = document.documentElement;
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (de.requestFullscreen) de.requestFullscreen().catch(() => {});
    } catch (e) { /* not allowed here */ }
  }

  function fromHash() {
    const h = decodeURIComponent(location.hash.replace(/^#/, '')).toLowerCase();
    const mm = h.match(/^(?:beat|step)-(\d+)$/);
    if (mm && STEPS['beat-' + mm[1]]) return 'beat-' + mm[1];
    if (h === 'what-if-frozen') return 'what-if';
    if (h === 'what-if-refunded' || h === 'refund') return 'what-if-refund';
    if (h === 'pay') return 'beat-3-pay';
    if (h === 'return') return 'beat-9-return';
    return STEPS[h] ? h : null;
  }
  addEventListener('hashchange', () => { const id = fromHash(); if (id && id !== cur) go(id, 'jump'); });

  /* ------------------------------------------------------------------ fit the phones to the stage */
  const PHONE_W = 360;
  const phones = [$('.phone', pj), $('.phone', pl)];
  function fit() {
    if (!desk.matches) { phones.forEach((p) => p.style.removeProperty('--phone-scale')); return; }
    const PHONE_H = parseFloat(getComputedStyle(phones[0]).getPropertyValue('--phone-h')) || 680;   // 640 on short screens
    const cs = getComputedStyle(stage);
    const h = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const gap = parseFloat(cs.columnGap) || 0;
    const w = (stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 3 * gap) / 4;
    const s = Math.max(0.45, Math.min(h / PHONE_H, w / PHONE_W, 1.25));
    phones.forEach((p) => p.style.setProperty('--phone-scale', s.toFixed(4)));
    checkOver();
  }
  // The center column fades at its cut edge when it has more below (short window), so nothing disappears without a sign.
  const holdEl = $('#hold');
  function checkOver() { holdEl.classList.toggle('is-over', holdEl.scrollTop + holdEl.clientHeight < holdEl.scrollHeight - 2); }
  holdEl.addEventListener('scroll', checkOver, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage); else addEventListener('resize', fit);
  desk.addEventListener('change', fit);

  go(fromHash() || 'beat-1', 'jump');
  fit();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
</body>
</html>
